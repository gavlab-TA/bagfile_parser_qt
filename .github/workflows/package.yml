name: Package

# Builds the installable artifacts for all three platforms. Nothing is ever
# committed: artifacts are attached to the workflow run, and to a GitHub
# Release when the trigger is a version tag.
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-22.04   # oldest supported glibc/Qt, so the .deb installs widely
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        env:
          BPQ_VERSION: ${{ steps.ver.outputs.version }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./scripts/package.sh
        # package.sh installs its own build dependencies via apt.

      - name: Verify the package
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          echo "::group::metadata"; dpkg-deb -I "$deb"; echo "::endgroup::"
          echo "::group::contents"; dpkg-deb -c "$deb"; echo "::endgroup::"
          # Install it for real and confirm the binary runs.
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          bagfile_parser_qt --help
          # desktop-file-utils is not on the runner by default.
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate /usr/share/applications/bagfile_parser_qt.desktop
          sudo apt-get remove -y bagfile-parser-qt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*

  macos:
    name: macOS (.dmg)
    # Intel runners (macos-13) are being retired and now sit queued for hours,
    # which stalls the whole run. An Intel .dmg is produced by running
    # scripts/package.sh on an Intel Mac.
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        env:
          BPQ_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/package.sh

      - name: Verify the disk image
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          hdiutil attach "$dmg" -mountpoint /tmp/bpq -nobrowse -readonly
          ls -la /tmp/bpq
          test -d /tmp/bpq/bagfile_parser_qt.app || { echo "no .app in the dmg"; exit 1; }
          test -L /tmp/bpq/Applications      || { echo "no /Applications drop target"; exit 1; }
          # The bundle must carry its own Qt, or it will not run on a clean Mac.
          fw=/tmp/bpq/bagfile_parser_qt.app/Contents/Frameworks
          test -d "$fw/QtCore.framework" || { echo "Qt was not bundled into the .app"; exit 1; }
          echo "::group::bundled libraries"; ls "$fw"; echo "::endgroup::"
          # Same for the Homebrew libraries: matio (and the HDF5 it needs) must be
          # inside the bundle, since the target Mac will not have Homebrew.
          ls "$fw" | grep -q '^libmatio' || { echo "matio was not bundled into the .app"; exit 1; }
          ls "$fw" | grep -q '^libhdf5'  || { echo "hdf5 was not bundled into the .app"; exit 1; }
          # Nothing may still point at /opt/homebrew, or it breaks off this machine.
          if otool -L /tmp/bpq/bagfile_parser_qt.app/Contents/MacOS/bagfile_parser_qt \
               | grep -q /opt/homebrew; then
            echo "the executable still links against Homebrew paths:"
            otool -L /tmp/bpq/bagfile_parser_qt.app/Contents/MacOS/bagfile_parser_qt
            exit 1
          fi
          /tmp/bpq/bagfile_parser_qt.app/Contents/MacOS/bagfile_parser_qt --help
          hdiutil detach /tmp/bpq

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: dist/*

  windows:
    name: Windows (installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: win64_msvc2019_64
          cache: true

      # matio pulls in HDF5, which takes minutes to build from source.
      # vcpkg's x-gha backend was removed, so cache the built packages directly.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build package
        shell: pwsh
        env:
          BPQ_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          .\scripts\package.ps1 -QtDir "$env:QT_ROOT_DIR" -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"

      - name: Verify the installer
        shell: pwsh
        run: |
          # Only real packages may be published. A bare bagfile_parser_qt.exe here
          # would be the raw linker output with no Qt DLLs beside it - it looks
          # like the app, and crashes the moment anyone runs it.
          $stray = Get-ChildItem dist -File |
            Where-Object { $_.Name -notmatch '^bagfile_parser_qt-.+\.exe$' }
          if ($stray) { throw "unshippable files in dist/: $($stray.Name -join ', ')" }

          $inst = Get-ChildItem dist\*.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'bpq-install'

          # Actually run the installer, the way a user would. /S is silent;
          # /D must come last and be unquoted.
          Write-Host "installing $($inst.Name) to $dest"
          $p = Start-Process -FilePath $inst.FullName -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          if (-not (Test-Path $dest)) { throw "the installer created nothing at $dest" }

          Write-Host "::group::installed tree"
          Get-ChildItem $dest -Recurse -File | ForEach-Object { $_.FullName.Replace($dest,'') }
          Write-Host "::endgroup::"

          $exe = Join-Path $dest 'bin\bagfile_parser_qt.exe'
          if (-not (Test-Path $exe)) { throw "bagfile_parser_qt.exe was not installed" }
          $bin = Split-Path $exe -Parent

          # Everything the app needs must have been installed with it, since the
          # target machine has no Qt and may have no VC++ redistributable.
          if (-not (Get-ChildItem $bin -Filter 'Qt*Core.dll')) { throw "Qt DLLs were not installed" }
          if (-not (Test-Path (Join-Path $bin 'platforms\qwindows.dll'))) {
            throw "the qwindows platform plugin is missing; the GUI would not start"
          }
          foreach ($dll in @('vcruntime140.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $bin $dll))) {
              throw "$dll was not installed; the app would not start without the VC++ redistributable"
            }
          }

          # Run the installed binary, not one from the build tree.
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "the installed exe did not run" }

          # The uninstaller must work too, or we leave people stuck.
          $uninst = Get-ChildItem $dest -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninst) { throw "no uninstaller was installed" }
          $u = Start-Process -FilePath $uninst.FullName -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "the uninstaller exited with $($u.ExitCode)" }
          Write-Host "installer and uninstaller both succeeded"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*

  release:
    name: Attach to release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
